[project]
name = "nn-hub"
version = "0.1.0"
description = "nn project hub — device registry, config sync, OTA"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "websockets>=12.0",
    "cryptography>=42.0",
    "aiocoap>=0.4",
    "bleak>=0.22",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "zeroconf>=0.130",
]

[project.scripts]
nn-hub          = "hub.main:cli"
nn-provisioner  = "nn_provisioner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hub", "nn_provisioner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
