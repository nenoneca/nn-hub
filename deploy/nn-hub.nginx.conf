# nn hub — single entry point on :80.
#
# Everything the browser needs is already single-origin behind the hub
# (it proxies each camera's snapshot / ws / hls / detections / events), so
# this only has to put the hub on 80 and keep streaming semantics intact.
# A tunnel (cloudflared, ngrok, …) then needs exactly one target: :80.

upstream nn_hub { server 127.0.0.1:8769; keepalive 16; }

map $http_upgrade $connection_upgrade {   # ws upgrade passthrough
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # event uploads from the cameras carry whole mp4s
    client_max_body_size 512m;

    # a stalled live view must not be killed by the proxy: HLS polls, the
    # jMuxer WebSocket is long-lived, and MJPEG-ish responses never end.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;               # stream through, don't accumulate
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ── access control ───────────────────────────────────────────────────
    # The hub API has NO auth of its own in this deployment, so anything
    # that can reach :80 can watch the cameras and delete recordings.  That
    # is fine on the LAN and NOT fine through a public tunnel.
    # Enabling is a one-liner, no config edit:
    #     sudo htpasswd -c /etc/nginx/nn.htpasswd <user>     # once
    #     printf 'auth_basic "nn hub";\nauth_basic_user_file /etc/nginx/nn.htpasswd;\n' \
    #         | sudo tee /etc/nginx/nn-auth.conf
    #     sudo nginx -t && sudo systemctl reload nginx
    # (Cloudflare Access in front is equivalent and nicer — then leave this
    # empty.  Cameras POST to the hub over the LAN, so they are unaffected.)
    include /etc/nginx/nn-auth.conf;

    # WebSockets carry a ticket instead of credentials: a browser never
    # attaches saved HTTP auth to a socket handshake, so leaving basic auth
    # on these paths popped a login box for every live view and every log
    # stream.  The hub mints single-use, 60-second tickets on an
    # AUTHENTICATED endpoint (/api/v1/ws-ticket) and refuses a socket
    # without one, so this is a swap of mechanism, not a hole.
    location = /api/v1/logs/ws {
        auth_basic off;
        proxy_pass http://nn_hub;
    }
    location = /api/v1/fleet/ws {
        auth_basic off;
        proxy_pass http://nn_hub;
    }
    location ~ ^/api/v1/cameras/[^/]+/ws$ {
        auth_basic off;
        proxy_pass http://nn_hub;
    }

    location / {
        proxy_pass http://nn_hub;
    }

    # convenience: bare host lands on the webapp instead of a 404
    location = / {
        return 302 /devices;
    }

    # HLS segments are immutable once written; the playlist must never be
    # cached or a viewer sticks on a stale window.
    location ~* /hls/.*\.ts$   { proxy_pass http://nn_hub; expires 1m; }
    location ~* /hls/.*\.m3u8$ {
        proxy_pass http://nn_hub;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
