# Drop-in for nn-media-ctrl.service.
#
# The camera dials this server using the HUB's X25519 pubkey — the one baked
# into its provisioning CONFIG (nn_prov hub_pub).  The unit shipped with
# --keydir /var/lib/nn-media/keys, which holds the VIDEO SERVICE's stream key,
# so ECDH derived a different shared secret on each side.  The handshake still
# "succeeded" structurally and the very first sealed record then failed to
# decrypt: the device left its recv loop with reqs_served=0 and the server
# logged "peer closed", forever, at ~40 reconnects/minute.
#
# Cameras therefore never received SET_TIME — their ONLY clock source
# (nn_timesync_set_epoch is called from exactly one place, nn_ctrl's SET_TIME
# handler; there is no SNTP).  Every camera ran on uptime, and the live view
# showed "up 345:52:58" instead of a date.
#
# Point it at the hub's own keydir.  Verified 2026-08-21: SET_TIME status=0,
# PING -> pong, TIME_STATUS synced=1 with a real epoch.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /home/orangepi/nn_project_nowest/media/host/media_ctrl_server.py --port 8772 --keydir /home/orangepi/.nn-hub
