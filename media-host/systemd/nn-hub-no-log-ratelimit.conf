# Drop-in for nn-hub.service.
#
# proto_router logs every ~5 s per gateway.  With journald's default rate
# limit that steady drip is enough to make journald DROP unrelated bursts:
# the entire BLE provisioning trace vanished on 2026-08-21, which is why a
# firmware bug looked like a radio problem for as long as it did.  The hub is
# the one service whose logs we debug from, so exempt it.
[Service]
LogRateLimitIntervalSec=0
LogRateLimitBurst=0
