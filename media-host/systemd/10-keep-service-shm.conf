[Login]
# nn-video* run as the ORANGEPI user and keep their HLS segments in
# /dev/shm.  With RemoveIPC=yes (the default) logind purges that user's
# /dev/shm objects when their last LOGIN session ends — so every time an
# operator SSH session closed, all three cameras lost their segment
# directories, ffmpeg died with ENOENT and respawned every ~2 s, and the
# live view showed nothing.  (loginctl enable-linger orangepi is also set;
# this makes the guarantee survive a user-manager restart.)
RemoveIPC=no
